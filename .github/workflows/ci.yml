name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore RiftCache.slnx

      - run: dotnet build RiftCache.slnx --no-restore --configuration Release

      - run: dotnet test RiftCache.slnx --no-build --configuration Release
