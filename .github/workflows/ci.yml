name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Azurite backs the AzureBlobPersistenceProvider integration tests -- CONTRIBUTING.md's stated
    # requirement for cloud provider tests is that they run against a local emulator in CI, not
    # real cloud resources. Listens on the same localhost:10000 the tests already hardcode.
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore RiftCache.slnx

      - run: dotnet build RiftCache.slnx --no-restore --configuration Release

      - run: dotnet test RiftCache.slnx --no-build --configuration Release

  # Publishes a prerelease RiftCache.Client build to GitHub Packages on every merge to main, so
  # consumers have something installable ahead of an actual nuget.org release. Not gated on path
  # changes on purpose -- keeps this simple while the project is early-stage.
  publish-client-preview:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: >
          dotnet pack src/RiftCache.Client/RiftCache.Client.csproj
          --configuration Release
          --version-suffix "preview.${{ github.run_number }}"
          --output ./nupkg

      - run: >
          dotnet nuget push ./nupkg/*.nupkg
          --source "https://nuget.pkg.github.com/vectorloom/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
